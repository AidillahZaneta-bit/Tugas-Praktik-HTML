<html>
    <head>
        <title>Form Pendaftaran</title>
    </head>
    <body>
        <h2>Form Pendaftaran</h2>
        <form>
            <table>
                <tr>
                    <td><label>Nama Lengkap</label></td>
                    <td>:</td>
                    <td><input type="text" required placeholder="Nama lengkap sesuai akta"></td>
                </tr>
                <tr>
                    <td><label>No HP</label></td>
                    <td>:</td>
                    <td><input type="number" required placeholder="08xxxxxxxx"></td>
                </tr>
                <tr>
                    <td><label>Email</label></td>
                    <td>:</td>
                    <td><input type="email" required placeholder="email@contoh.com"></td>
                </tr>
                <tr>
                    <td><label>Password</label></td>
                    <td>:</td>
                    <td><input type="password" required placeholder="Kata sandi email"></td>
                </tr>
                <tr>
                    <td><label>Tanggal Lahir</label></td>
                    <td>:</td>
                    <td><input type="date" required placeholder="Tanggal lahir sesuai akta"></td>
                </tr>
                <tr>
                    <td><label>Jenis Kelamin</label></td>
                    <td>:</td>
                    <td><input type="radio" name="jenisKelamin" value="Laki-Laki">Laki-Laki</td>
                    <td><input type="radio" name="jenisKelamin" value="Perempuan">Perempuan</td>
                </tr>
                <tr>
                    <td><label>Hobi</label></td>
                    <td>:</td>
                    <td>
                        <label><input type="checkbox" name="hobi" value="Membaca">Membaca</label>
                        <label><input type="checkbox" name="hobi" value="Menulis">Menulis</label>                   
                        <label><input type="checkbox" name="hobi" value="Olahraga">Olahraga</label>
                        <label><input type="checkbox" name="hobi" value="Seni Tari">Seni Tari</label>
                </tr>
                <tr>
                    <td><label>Alamat</label></td>
                    <td>:</td>
                    <td><textarea placeholder="Masukkan Alamat"></textarea></td>
                </tr>
                <tr>
                    <td><label>Jurusan</label></td>
                    <td>:</td>
                    <td><select id="jurusan" name="jurusan">
                        <option value="RPL">RPL</option>
                        <option value="TKJ">TKJ</option>
                        <option value="PG">PG</option>
                    </select>
                </td>
                </tr>
                <tr>
                    <td><label>Foto</label></td>
                    <td>:</td>
                    <td><input type="file"></td>
                    <td><input type="submit"></td>
                </tr>
            </table>
        </form>
    </body>
</html>
